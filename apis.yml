aid: quris
name: Quris
description: 'Quris-AI is a Bio-AI company building what it describes as pharma''s first AI safety-prediction
  platform, aiming to predict which drug candidates will be safe in humans before they reach clinical
  trials. Its approach couples machine learning with "Patients-on-a-Chip" technology — miniaturized,
  organ-representative human tissue models that generate automatically-tagged biological data used to
  train classification algorithms for drug-safety prediction. The company targets the roughly 89% of
  drugs that fail in clinical trials, seeking to de-risk and accelerate pharmaceutical development.
  Based in Boston and Tel Aviv, Quris was co-founded with pioneers including Moderna co-founder Robert
  Langer and Nobel Laureate Aaron Ciechanover. Quris is backed by SoftBank Vision Fund and is profiled
  in the API Evangelist network as a company lead.'
